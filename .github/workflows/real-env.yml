name: Real environment

# Builds the real-server stack, checks it end to end through the gateway, and
# verifies the lab server's isolation guarantees.
on:
  pull_request:
    paths:
      - "server/**"
      - "docker-compose.real.yml"
      - "nginx.real.conf"
      - "Dockerfile"
      - ".github/workflows/real-env.yml"
      - "src/realServer.ts"
      - "src/realHttp.ts"
      - "src/labs/**"
      - "scripts/test-real-labs.ts"

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix server test

  stack:
    runs-on: ubuntu-latest
    env:
      HACKLAB_PORT: "18080"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker compose -f docker-compose.real.yml up -d --build --wait
      - name: Every real lab agrees with the reference exploits
        run: HACKLAB_URL=http://localhost:18080 npm run test:real
      - name: Gateway serves the app and proxies /api/
        run: |
          curl -fsS http://localhost:18080/ > /dev/null
          curl -fsS http://localhost:18080/api/healthz | grep '"ok"'
          curl -fsS http://localhost:18080/api/info | grep '/sqli' | grep '/cmdi'
          for lab in sqli xss cmdi path csrf idor auth jwt ssrf upload crypto misconf deps integrity logging; do
            curl -fsS http://localhost:18080/api/info | grep "\"/$lab\"" > /dev/null || { echo "missing real lab: $lab"; exit 1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"level":1,"input":{}}' http://localhost:18080/api/sqli/run)
          test "$code" = "404"
      - name: Real labs are exploitable through the gateway
        run: |
          curl -fsS -X POST -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "username=admin'-- " --data-urlencode "password=x" \
            http://localhost:18080/api/sqli/lv1/login | grep 'administrator'
          curl -fsS -X POST -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'host=8.8.8.8 $(cat flag.txt)' \
            http://localhost:18080/api/cmdi/lv3/ping | grep 'FLAG{c0mmand_1nj3ct10n}'
          curl -fsS -X POST -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'host=8.8.8.8; cat flag.txt' \
            http://localhost:18080/api/cmdi/lv5/ping | grep 'reject'
      - name: Lab server is isolated
        run: |
          if docker compose -f docker-compose.real.yml exec -T lab-server wget -q -T 3 -O- http://example.com; then
            echo "lab-server must not have outbound access"; exit 1
          fi
          if docker compose -f docker-compose.real.yml exec -T lab-server touch /app/x; then
            echo "lab-server rootfs must be read-only"; exit 1
          fi
      - if: failure()
        run: docker compose -f docker-compose.real.yml logs
      - if: always()
        run: docker compose -f docker-compose.real.yml down -v
