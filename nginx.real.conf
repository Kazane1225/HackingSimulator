# Gateway config for the real-server environment (docker-compose.real.yml).
# Same static site as nginx.conf, plus /api/ proxied to the isolated lab server.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No Content-Security-Policy on purpose; see nginx.conf.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The trailing slash strips the /api/ prefix before proxying.
    location /api/ {
        proxy_pass http://lab-server:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
