server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No Content-Security-Policy here on purpose: srcdoc iframes inherit the
    # parent's CSP, and a strict script-src would stop the XSS lab's sandboxed
    # preview from running payloads at all.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # The XSS lab's iframe is a srcdoc document, so this does not affect it.
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
